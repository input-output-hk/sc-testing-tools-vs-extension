<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <style>
    text       { font-family: var(--vscode-font-family, "Segoe UI", system-ui, Ubuntu, sans-serif); }
    .panel     { fill: var(--vscode-editorWidget-background, #252526); }
    .edge      { stroke: var(--vscode-panel-border, #454545); stroke-width: 1.5; fill: none; }
    .dot       { fill: var(--vscode-panel-border, #454545); }
    .line      { fill: var(--vscode-descriptionForeground, #9d9d9d); }
    .label     { fill: var(--vscode-descriptionForeground, #9d9d9d); font-size: 16px; }
    .prompt    { stroke: var(--vscode-terminal-ansiGreen, #23d18b); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .arrow     { stroke: var(--vscode-textLink-foreground, #3794ff); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .container { stroke: var(--vscode-descriptionForeground, #9d9d9d); stroke-width: 2; fill: none; stroke-dasharray: 8 6; }
    .cube      { fill: var(--vscode-charts-blue, #3794ff); }
  </style>

  <!-- The Windows host -->
  <g>
    <rect x="30" y="30" width="740" height="390" rx="10" class="panel"/>
    <rect x="30" y="30" width="740" height="390" rx="10" class="edge"/>
    <line x1="30" y1="66" x2="770" y2="66" class="edge"/>
    <g class="line">
      <rect x="48" y="41" width="6" height="6"/>
      <rect x="56" y="41" width="6" height="6"/>
      <rect x="48" y="49" width="6" height="6"/>
      <rect x="56" y="49" width="6" height="6"/>
    </g>
    <text x="74" y="54" class="label">Windows</text>
  </g>

  <!-- WSL2: everything PBT needs lives in here -->
  <g>
    <rect x="65" y="100" width="670" height="290" rx="14" class="container"/>
    <text x="85" y="127" class="label">WSL2 (Linux)</text>
  </g>

  <!-- VS Code connected to WSL, running PBT -->
  <g>
    <rect x="100" y="150" width="240" height="200" rx="8" class="panel"/>
    <rect x="100" y="150" width="240" height="200" rx="8" class="edge"/>
    <line x1="100" y1="176" x2="340" y2="176" class="edge"/>
    <circle cx="120" cy="163" r="4" class="dot"/>
    <circle cx="135" cy="163" r="4" class="dot"/>
    <circle cx="150" cy="163" r="4" class="dot"/>
    <line x1="170" y1="176" x2="170" y2="350" class="edge"/>
    <g class="line">
      <rect x="113" y="195" width="44" height="8" rx="4"/>
      <rect x="113" y="218" width="34" height="8" rx="4"/>
      <rect x="113" y="241" width="40" height="8" rx="4"/>
      <rect x="187" y="195" width="120" height="8" rx="4"/>
      <rect x="187" y="218" width="90" height="8" rx="4"/>
      <rect x="187" y="241" width="108" height="8" rx="4"/>
      <rect x="187" y="264" width="76" height="8" rx="4"/>
      <rect x="187" y="287" width="100" height="8" rx="4"/>
    </g>
  </g>

  <!-- PBT calls Nix in the same environment -->
  <g>
    <line x1="365" y1="250" x2="428" y2="250" class="arrow"/>
    <path d="M420 237 L440 250 L420 263" class="arrow"/>
  </g>

  <!-- A Linux shell with Nix installed -->
  <g>
    <rect x="465" y="150" width="235" height="200" rx="8" class="panel"/>
    <rect x="465" y="150" width="235" height="200" rx="8" class="edge"/>
    <path d="M485 175 L495 183 L485 191" class="prompt"/>
    <line x1="502" y1="191" x2="518" y2="191" class="prompt"/>
    <g class="cube">
      <path d="M582 205 L632 233 L582 261 L532 233 Z"/>
      <path d="M632 233 L632 291 L582 319 L582 261 Z" opacity="0.75"/>
      <path d="M532 233 L532 291 L582 319 L582 261 Z" opacity="0.5"/>
    </g>
    <g class="edge">
      <path d="M582 205 L632 233 L582 261 L532 233 Z"/>
      <path d="M632 233 L632 291 L582 319 L582 261"/>
      <path d="M532 233 L532 291 L582 319"/>
    </g>
  </g>
</svg>
