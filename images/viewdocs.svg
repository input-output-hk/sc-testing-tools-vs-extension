<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <style>
    .panel     { fill: var(--vscode-editorWidget-background, #252526); }
    .edge      { stroke: var(--vscode-panel-border, #454545); stroke-width: 1.5; fill: none; }
    .dot       { fill: var(--vscode-panel-border, #454545); }
    .line      { fill: var(--vscode-descriptionForeground, #9d9d9d); }
    .strong    { fill: var(--vscode-foreground, #cccccc); }
    .arrow     { stroke: var(--vscode-textLink-foreground, #3794ff); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .accent    { fill: var(--vscode-textLink-foreground, #3794ff); }
    .selection { fill: var(--vscode-list-activeSelectionBackground, #094771); }
    .headerbar { fill: var(--vscode-textLink-foreground, #3794ff); }
  </style>

  <!-- The extension: an editor window with the README selected in the file tree -->
  <g>
    <rect x="45" y="115" width="250" height="220" rx="8" class="panel"/>
    <rect x="45" y="115" width="250" height="220" rx="8" class="edge"/>
    <line x1="45" y1="143" x2="295" y2="143" class="edge"/>
    <circle cx="68" cy="129" r="4" class="dot"/>
    <circle cx="84" cy="129" r="4" class="dot"/>
    <circle cx="100" cy="129" r="4" class="dot"/>
    <line x1="125" y1="143" x2="125" y2="335" class="edge"/>

    <rect x="60" y="185" width="52" height="12" rx="4" class="selection"/>
    <rect x="46" y="182" width="3" height="18" class="accent"/>

    <g class="line">
      <rect x="60" y="165" width="48" height="8" rx="4"/>
      <rect x="145" y="165" width="120" height="8" rx="4"/>
      <rect x="145" y="190" width="95" height="8" rx="4"/>
      <rect x="145" y="215" width="110" height="8" rx="4"/>
      <rect x="145" y="240" width="80" height="8" rx="4"/>
      <rect x="145" y="265" width="105" height="8" rx="4"/>
    </g>
    <rect x="60" y="187" width="44" height="8" rx="4" class="accent"/>
    <rect x="60" y="215" width="44" height="8" rx="4" class="line"/>
  </g>

  <!-- Opens the documentation -->
  <g>
    <line x1="325" y1="225" x2="388" y2="225" class="arrow"/>
    <path d="M380 212 L400 225 L380 238" class="arrow"/>
  </g>

  <!-- The README / documentation page -->
  <g>
    <rect x="435" y="115" width="320" height="220" rx="8" class="panel"/>
    <rect x="435" y="115" width="320" height="220" rx="8" class="edge"/>
    <path d="M443 115 h304 a8 8 0 0 1 8 8 v20 h-320 v-20 a8 8 0 0 1 8 -8 z" class="headerbar"/>

    <rect x="455" y="163" width="150" height="13" rx="6" class="strong"/>

    <g class="line">
      <rect x="455" y="192" width="250" height="8" rx="4"/>
      <rect x="455" y="215" width="215" height="8" rx="4"/>
      <rect x="455" y="238" width="235" height="8" rx="4"/>
    </g>

    <rect x="455" y="264" width="45" height="7" rx="3.5" class="accent"/>

    <g class="line">
      <rect x="455" y="287" width="190" height="8" rx="4"/>
      <rect x="455" y="310" width="145" height="8" rx="4"/>
    </g>
  </g>
</svg>
