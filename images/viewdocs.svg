<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <style>
    .panel     { fill: var(--vscode-editorWidget-background, #252526); }
    .edge      { stroke: var(--vscode-panel-border, #454545); stroke-width: 1.5; fill: none; }
    .dot       { fill: var(--vscode-panel-border, #454545); }
    .line      { fill: var(--vscode-descriptionForeground, #9d9d9d); }
    .accent    { fill: var(--vscode-textLink-foreground, #3794ff); }
    .selection { fill: var(--vscode-list-activeSelectionBackground, #094771); }
    .arrow     { stroke: var(--vscode-charts-purple, #b180d7); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .mark      { fill: var(--vscode-charts-purple, #b180d7); }
    .headerbar { fill: var(--vscode-textLink-foreground, #3794ff); }
  </style>

  <!-- 820x460 artwork scaled to fit a 16:9 canvas -->
  <g transform="translate(0 0.6) scale(0.9756)">
    <!-- Editor window with a file tree -->
    <g>
      <rect x="40" y="90" width="330" height="300" rx="10" class="panel"/>
      <rect x="40" y="90" width="330" height="300" rx="10" class="edge"/>
      <line x1="40" y1="128" x2="370" y2="128" class="edge"/>
      <circle cx="65" cy="109" r="5" class="dot"/>
      <circle cx="83" cy="109" r="5" class="dot"/>
      <circle cx="101" cy="109" r="5" class="dot"/>
      <line x1="168" y1="128" x2="168" y2="390" class="edge"/>
      <rect x="60" y="165" width="90" height="10" rx="5" class="line"/>
      <rect x="60" y="197" width="60" height="10" rx="5" class="line"/>
      <rect x="42" y="228" width="4" height="30" class="accent"/>
      <rect x="60" y="235" width="100" height="14" rx="4" class="selection"/>
      <rect x="60" y="235" width="90" height="10" rx="5" class="accent"/>
      <rect x="60" y="273" width="70" height="10" rx="5" class="line"/>
      <rect x="188" y="165" width="130" height="10" rx="5" class="line"/>
      <rect x="188" y="197" width="100" height="10" rx="5" class="line"/>
      <rect x="188" y="229" width="115" height="10" rx="5" class="line"/>
      <rect x="188" y="261" width="90" height="10" rx="5" class="line"/>
      <rect x="188" y="293" width="120" height="10" rx="5" class="line"/>
      <rect x="188" y="325" width="60" height="10" rx="5" class="line"/>
    </g>

    <!-- Points to the documentation -->
    <g>
      <line x1="405" y1="240" x2="480" y2="240" class="arrow"/>
      <path d="M470 220 L495 240 L470 260" class="arrow"/>
    </g>

    <!-- The README / documentation page -->
    <g>
      <rect x="520" y="90" width="290" height="300" rx="10" class="panel"/>
      <rect x="520" y="90" width="290" height="300" rx="10" class="edge"/>
      <path d="M530 90 h270 a10 10 0 0 1 10 10 v20 h-290 v-20 a10 10 0 0 1 10 -10 z" class="headerbar"/>
      <rect x="546" y="140" width="150" height="18" rx="4" class="accent"/>
      <rect x="546" y="182" width="220" height="10" rx="5" class="line"/>
      <rect x="546" y="204" width="205" height="10" rx="5" class="line"/>
      <rect x="546" y="226" width="215" height="10" rx="5" class="line"/>
      <rect x="546" y="257" width="45" height="6" rx="3" class="mark"/>
      <rect x="546" y="272" width="180" height="10" rx="5" class="line"/>
      <rect x="546" y="294" width="200" height="10" rx="5" class="line"/>
      <rect x="546" y="330" width="130" height="10" rx="5" class="line"/>
    </g>
  </g>
</svg>
