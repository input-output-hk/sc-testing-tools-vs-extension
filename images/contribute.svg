    .node     { fill: var(--vscode-descriptionForeground, #9d9d9d); }
    .branch   { stroke: var(--vscode-textLink-foreground, #3794ff); stroke-width: 3; fill: none; }
    .merge    { fill: var(--vscode-textLink-foreground, #3794ff); }
  </style>

