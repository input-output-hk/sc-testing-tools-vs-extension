<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <style>
    .panel     { fill: var(--vscode-editorWidget-background, #252526); }
    .edge      { stroke: var(--vscode-panel-border, #454545); stroke-width: 1.5; fill: none; }
    .dot       { fill: var(--vscode-panel-border, #454545); }
    .line      { fill: var(--vscode-descriptionForeground, #9d9d9d); }
    .arrow     { stroke: var(--vscode-textLink-foreground, #3794ff); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .container { stroke: var(--vscode-descriptionForeground, #9d9d9d); stroke-width: 2; fill: none; stroke-dasharray: 8 6; }
    .cube      { fill: var(--vscode-charts-blue, #3794ff); }
  </style>

  <!-- The extension: an editor window -->
  <g>
    <rect x="45" y="115" width="250" height="220" rx="8" class="panel"/>
    <rect x="45" y="115" width="250" height="220" rx="8" class="edge"/>
    <line x1="45" y1="143" x2="295" y2="143" class="edge"/>
    <circle cx="68" cy="129" r="4" class="dot"/>
    <circle cx="84" cy="129" r="4" class="dot"/>
    <circle cx="100" cy="129" r="4" class="dot"/>
    <line x1="125" y1="143" x2="125" y2="335" class="edge"/>
    <g class="line">
      <rect x="60" y="165" width="48" height="8" rx="4"/>
      <rect x="60" y="190" width="38" height="8" rx="4"/>
      <rect x="60" y="215" width="44" height="8" rx="4"/>
      <rect x="145" y="165" width="120" height="8" rx="4"/>
      <rect x="145" y="190" width="95" height="8" rx="4"/>
      <rect x="145" y="215" width="110" height="8" rx="4"/>
      <rect x="145" y="240" width="80" height="8" rx="4"/>
      <rect x="145" y="265" width="105" height="8" rx="4"/>
    </g>
  </g>

  <!-- Hands work off to the backend -->
  <g>
    <line x1="325" y1="225" x2="388" y2="225" class="arrow"/>
    <path d="M380 212 L400 225 L380 238" class="arrow"/>
  </g>

  <!-- The backend tool, running inside Docker or Nix -->
  <g>
    <rect x="435" y="95" width="320" height="260" rx="14" class="container"/>
    <g class="cube">
      <path d="M595 145 L665 185 L595 225 L525 185 Z"/>
      <path d="M665 185 L665 265 L595 305 L595 225 Z" opacity="0.75"/>
      <path d="M525 185 L525 265 L595 305 L595 225 Z" opacity="0.5"/>
    </g>
    <g class="edge">
      <path d="M595 145 L665 185 L595 225 L525 185 Z"/>
      <path d="M665 185 L665 265 L595 305 L595 225"/>
      <path d="M525 185 L525 265 L595 305"/>
    </g>
  </g>
</svg>
